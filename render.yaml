services:
  - type: web
    name: videos-downloader-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: "rm -rf dist node_modules && npm install && bash scripts/setup-ytdlp.sh && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://your-frontend-url.vercel.app
